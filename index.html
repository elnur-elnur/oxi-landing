<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#008069">
  <title>Elish & Nurush</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <button class="peer" id="peerInfo" title="Hesabat">
        <div class="avatar" id="avatar">?</div>
        <div class="who">
          <div class="name" id="peerName">Gözlənilir…</div>
          <div class="status" id="peerStatus">qoşulur…</div>
        </div>
      </button>
      <div class="avatar me-avatar" id="meAvatar"></div>
    </header>

    <div id="alert" class="alert" hidden>
      <span>⚠️</span><div id="alertText"></div><button id="alertOk">Gördüm</button>
    </div>

    <main id="list" class="list">
      <div id="items" class="items"></div>
    </main>

    <button id="toBottom" class="to-bottom" hidden aria-label="Aşağı">
      <span id="newCount" class="badge" hidden>0</span>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="emojiPanel" class="emoji-panel" hidden></div>

    <footer class="composer">
      <div class="input-wrap">
        <button class="icon-btn emoji-btn" id="emojiBtn" aria-label="Smayliklər">
          <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/><path d="M8 14.2c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Mesaj" autocomplete="off" enterkeyhint="enter"></textarea>
        <button class="icon-btn attach-btn" id="attachBtn" aria-label="Şəkil göndər">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M21 12.5l-8.4 8.1a5.6 5.6 0 0 1-7.8-8l8.6-8.3a3.7 3.7 0 0 1 5.3 5.3l-8.6 8.2a1.9 1.9 0 0 1-2.7-2.6l7.9-7.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
      <button class="send" id="sendBtn" aria-label="Göndər">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </footer>
  </div>

  <!-- Firebase qurulmayıbsa -->
  <div id="setup" class="modal" hidden>
    <div class="card">
      <h2>Quraşdırma lazımdır</h2>
      <p><code>config.js</code> faylına Firebase məlumatlarını yaz. Addımlar <code>README.md</code>-dədir.</p>
    </div>
  </div>

  <!-- Giriş / çıxış tarixçəsi -->
  <div id="history" class="modal" hidden>
    <div class="card history-card">
      <div class="h-head">
        <h2 id="historyTitle">Giriş / çıxış</h2>
        <button id="historyClose" class="icon-btn" aria-label="Bağla">✕</button>
      </div>
      <div id="historyList" class="h-list"></div>
    </div>
  </div>

  <!-- Şəkli böyük göstərmək -->
  <div id="viewer" class="viewer" hidden><img id="viewerImg" alt=""></div>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
